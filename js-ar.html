<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#FF5657">
  </head>

  <body>
    <style>
      body{
        background-color: #FF5657;
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .logo{
        max-width: 100px;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10000;
      }

      #overlay button {
        font-family: "Fira Sans";
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        background-color: #cc4545;
        color: white;
        cursor: pointer;
        white-space: nowrap;
        position: absolute;
        bottom: 90px;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .tutorial-text-container{
        font-family: "Fira Sans";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background-color:#cc4545 ;
        color: white;
        border-radius: 30px;
        padding: 20px; 
        width:80%
      }

      .tutorial-text-container p{
        font-size: 18px;
      }
    </style>

    <a href="index.html">
      <img class="logo" src="./public/imgs/js-logo.png" alt="Overlay Image">
    </a>

    <div id="overlay">
      <div class="tutorial-text-container">
        <h2 class="tutorial-text">
          Como funciona a experiência de Realidade Aumentada?
          <p>
            Aponte a câmara para o interior do panfleto (desdobrado), enquadrando-o, de modo a observar
            os elementos que emergem do mesmo.
          </p>
        </h2>
      </div>
      <button id="startButton"><b>Iniciar Realidade Aumentada</b></button>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./public/markers/jstarget.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- Single camera with cursor -->
      <a-camera position="0 0 0" look-controls="enabled: false" near="0.001" far="1000">
        <a-cursor fuse="false" rayOrigin="mouse"></a-cursor>
      </a-camera>

      <a-assets>
        <a-asset-item id="jsModelAsset" src="./public/models/jsmodels-6.glb"></a-asset-item>
        <a-asset-item id="js-btn" src="./public/models/js-btn.glb"></a-asset-item>
        <video id="jsVideoAsset" src="./public/videos/mariasoares.mp4" preload="auto" loop="true" muted="true"></video>
      </a-assets>

      <!-- TARGET (FIXED) -->
      <a-entity mindar-image-target="targetIndex: 0" id="target">

        <a-entity id="modelContainer">


          <!-- Model -->
          <a-gltf-model
            id="model"
            src="#jsModelAsset"
            position="0 0 0"
            rotation="180 90 90"
            scale="3 3 3"
            visible="false"
            material="depthWrite: false"
            class="clickable"
          ></a-gltf-model>
        </a-entity>

        <a-gltf-model
          id="buttonModel"
          src="#js-btn"
          position="0 0 0"
          rotation="0 0 0"
          scale="1 1 1"
          visible="false"
          class="clickable"
        ></a-gltf-model>

        <!-- Video -->
        <a-video 
          id="video"
          src="#jsVideoAsset"
          position="0 0 0"
          rotation="0 0 0"
          width="1.5"
          height="1"
          visible="false"
        ></a-video>

      </a-entity>
    </a-scene>

    <script>
        const startButton = document.querySelector("#startButton");
        const overlay = document.querySelector("#overlay");
        const target = document.querySelector("#target");

        const model = document.querySelector("#js-btn");
        const video = document.querySelector("#video");
        const videoAsset = document.querySelector("#jsVideoAsset");

        // Start AR
        startButton.addEventListener("click", () => {
            overlay.style.display = "none";
        });

        // Show model when target found
        target.addEventListener("targetFound", () => {
            model.setAttribute("visible", true);
        });

        target.addEventListener("targetLost", () => {
            model.setAttribute("visible", false);
            video.setAttribute("visible", false);
            videoAsset.pause();
        });

        // CLICK MODEL → PLAY VIDEO
        model.addEventListener("click", () => {
            video.setAttribute("visible", true);
            videoAsset.play();
        });
    </script>
  </body>
</html>
