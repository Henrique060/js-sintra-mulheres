<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #FF5657;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 30px;
      border: none;
      background: #cc4545;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div id="overlay">
  <div style="color:white; text-align:center; max-width:80%">
    <h2>Como funciona a experiência de Realidade Aumentada?</h2>
    <p>Aponte a câmara para o panfleto para ver o conteúdo.</p>
  </div>
  <button id="startButton">Iniciar</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./public/markers/jstarget.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="colorManagement: true"
>

  <a-assets>
    <a-asset-item id="jsModelAsset" src="./public/models/jsmodels-6.glb"></a-asset-item>
    <a-asset-item id="js-btn" src="./public/models/js-btn.glb"></a-asset-item>
    <video id="jsVideoAsset" src="./public/videos/mariasoares.mp4" preload="auto" loop muted playsinline></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false">
    <a-cursor rayOrigin="mouse"></a-cursor>
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="target">

    <!-- Main Model -->
    <a-gltf-model
      id="mainModel"
      src="#jsModelAsset"
      position="0 0 0"
      rotation="180 90 90"
      scale="3 3 3"
      visible="false">
    </a-gltf-model>

    <!-- Button Model -->
    <a-gltf-model
      id="buttonModel"
      src="#js-btn"
      position="0 0.3 0"
      scale="0.5 0.5 0.5"
      visible="false"
      class="clickable">
    </a-gltf-model>

    <!-- Video -->
    <a-video
      id="video"
      src="#jsVideoAsset"
      position="0 -0.3 0"
      width="1.5"
      height="1"
      visible="false">
    </a-video>

  </a-entity>
</a-scene>

<script>
const startButton = document.querySelector("#startButton");
const overlay = document.querySelector("#overlay");

const target = document.querySelector("#target");
const buttonModel = document.querySelector("#buttonModel");
const mainModel = document.querySelector("#mainModel");

const video = document.querySelector("#video");
const videoAsset = document.querySelector("#jsVideoAsset");

// Start AR
startButton.addEventListener("click", () => {
  overlay.style.display = "none";
});

// When target is found
target.addEventListener("targetFound", () => {
  console.log("Target found");

  mainModel.setAttribute("visible", true);
  buttonModel.setAttribute("visible", true);
});

// When target is lost
target.addEventListener("targetLost", () => {
  console.log("Target lost");

  mainModel.setAttribute("visible", false);
  buttonModel.setAttribute("visible", false);
  video.setAttribute("visible", false);

  videoAsset.pause();
  videoAsset.currentTime = 0;
});

// Click button → play video
buttonModel.addEventListener("click", () => {
  console.log("Button clicked");

  video.setAttribute("visible", true);

  videoAsset.play().catch(err => {
    console.warn("Video play failed:", err);
  });
});
</script>

</body>
</html>
